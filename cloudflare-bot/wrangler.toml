name = "ophunter-bot"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Non-secret config. Edit OPHUNTER_FEED_URL / TASKFLOW_SYNC_REPO if your repos differ.
[vars]
TASKFLOW_SYNC_REPO = "Mohith535/taskflow-sync"
OPHUNTER_FEED_URL = "https://raw.githubusercontent.com/Mohith535/opportunity-hunter/main/data/feed.json"
OPHUNTER_REPO = "Mohith535/opportunity-hunter"   # /pack starts this repo's daily.yml with pack_key
REMIND_DAYS = "3"
# His one chat (4 Nov, his yes): these go to EDI; a refusal falls back here. "" sends everything back here.
EDI_KINDS = "followup,reminder,reply_alert,weekly,pack_ready,digest,fresh"

# KV namespace for bot state (tracker + taste). Create it with:
#   wrangler kv namespace create BOT_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "BOT_KV"
id = "22c274eb2b75484fad6a1717f25a5c2f"

# Secrets are NOT stored here. Set them with `wrangler secret put <NAME>`:
#   TELEGRAM_BOT_TOKEN  WEBHOOK_SECRET  TASKFLOW_SYNC_TOKEN
#   GROQ_API_KEY  CEREBRAS_API_KEY  OPENROUTER_API_KEY
#   OWNER_CHAT_ID  BOT_API_TOKEN  GH_DISPATCH_TOKEN   (see README → "Private bot, /target and /pack")

# The bot is OPH's clock (src/schedule.js): GitHub's own schedule ran the 08:00 hunt 5-7 h late.
#   02:30 UTC = 08:00 IST  start daily.yml (the hunt, digest, packs)
#   03:30 UTC = 09:00 IST  due reminders + 'heard back?' follow-ups (src/followup.js)
#   01:50-17:50 UTC hourly = 07:20-23:20 IST  start fresh.yml
# One expression for all three keeps the account's cron count where it was. Must equal schedule.js CRON.
[triggers]
crons = ["30,50 1-17 * * *"]

# EDI is his one chat (4 Nov): Tell.tell() sends there, Intake.tap() takes his taps back. A kind listed in
# EDI_KINDS goes to EDI; if EDI refuses, it is sent here instead. Empty = everything stays in OPH's chat.
[[services]]
binding = "EDI"
service = "edi"
entrypoint = "Tell"
