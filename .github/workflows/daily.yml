name: Opportunity Hunter (daily)

# Runs in the cloud, laptop-independent.
#  - Schedule: every day at 08:00 IST (02:30 UTC).
#  - Manual:   "Run workflow" button (workflow_dispatch) — use this to prove it works.
#
# Cloud mode differs from local:
#  * OH_PHONE=true     -> ntfy push to your phone (the cloud deliverable)
#  * OH_DESKTOP=false  -> no GUI on a headless runner
#  * OH_TASKFLOW=false -> TaskFlow is local-only (~/.taskflow); can't run here
#  * OH_PUBLIC_LOGS    -> on automatically in Actions: this repo is public, so its run logs are
#                         public. The target's goal, places, pay floor and anything from the resume
#                         are never printed (config.PUBLIC_LOGS).
# Dedup/history state is committed back to the repo so repeats aren't re-notified.
#
# Private inputs arrive as secrets and are written to gitignored files on the runner only:
#   bot /target        -> hunt_target.json          FIRST: the Cloudflare bot's copy, which /target
#                                                   edits from the phone (OH_WORKER_URL + OH_WORKER_TOKEN)
#   OH_TARGET_JSON     -> hunt_target.json          fallback (py sync_secrets.py sets both from your laptop)
#   OH_CAREER_PROFILE  -> data/career_profile.json  (gzip+base64; raw would crowd the 48 KB limit)
# The runner is discarded after the job; packs are sent to Telegram and never uploaded as artifacts.

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 Asia/Kolkata
  workflow_dispatch:
    inputs:
      packs_only:
        description: "Only build + send application packs from the latest run (no hunt, no state commit)"
        type: boolean
        default: false
      pack_key:
        description: "One pack for this item key (what a 📦 tap / /pack N sends); implies packs_only"
        type: string
        default: ""
      intake_key:
        description: "One pack for a job EDI handed over (the packet itself stays in the bot's storage)"
        type: string
        default: ""

permissions:
  contents: write          # needed to commit seen_items.json / history.json back

concurrency:
  group: opportunity-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      CLIST_USERNAME: ${{ secrets.CLIST_USERNAME }}
      CLIST_API_KEY: ${{ secrets.CLIST_API_KEY }}
      # Auto-provided by Actions (no manual secret needed); lifts GitHub API rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Phase 2 — LLM intelligence (provider-agnostic chain; tried in order). Free,
      # no-card keys: Groq (console.groq.com), Cerebras (cloud.cerebras.ai),
      # OpenRouter (openrouter.ai/keys). Gemini is intentionally absent — reserved
      # for Nova's Kaggle x Google capstone. OH_PROFILE_JSON: the personal profile as
      # a JSON string (repo is public, so the real profile lives in a secret, never in
      # code). All optional — if none set, the run falls back to rule-based scoring.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OH_PROFILE_JSON: ${{ secrets.OH_PROFILE_JSON }}
      # Telegram digest (interactive — buttons are handled by the Cloudflare bot).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OH_PHONE: "true"
      OH_DESKTOP: "false"
      OH_TASKFLOW: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore private files from secrets
        env:
          OH_TARGET_JSON: ${{ secrets.OH_TARGET_JSON }}
          OH_CAREER_PROFILE: ${{ secrets.OH_CAREER_PROFILE }}
          OH_WORKER_URL: ${{ secrets.OH_WORKER_URL }}
          OH_WORKER_TOKEN: ${{ secrets.OH_WORKER_TOKEN }}
        run: |
          # Both land in gitignored paths. Prove that first — if it were ever not true, the persist
          # step below would publish them.
          for f in hunt_target.json data/career_profile.json; do
            git check-ignore -q "$f" || { echo "::error::$f is not gitignored — refusing to write it"; exit 1; }
          done
          # The bot's copy first — that is the one /target edits from the phone.
          got=""
          if [ -n "$OH_WORKER_URL" ] && [ -n "$OH_WORKER_TOKEN" ] \
             && curl -fsS --max-time 20 -H "Authorization: Bearer $OH_WORKER_TOKEN" \
                     "$OH_WORKER_URL/target" -o "$RUNNER_TEMP/t.json" 2>/dev/null \
             && python .github/scripts/bot_target.py "$RUNNER_TEMP/t.json"; then
            got=1
          fi
          rm -f "$RUNNER_TEMP/t.json"
          if [ -n "$got" ]; then
            :
          elif [ -n "$OH_TARGET_JSON" ]; then
            printf '%s' "$OH_TARGET_JSON" > hunt_target.json
            python -c "import json; json.load(open('hunt_target.json', encoding='utf-8'))" \
              && echo "target: restored" || { echo "target: secret is not valid JSON, ignored"; rm -f hunt_target.json; }
          else
            echo "target: none (set OH_TARGET_JSON with: py sync_secrets.py)"
          fi
          if [ -n "$OH_CAREER_PROFILE" ]; then
            if printf '%s' "$OH_CAREER_PROFILE" | base64 -d | gunzip > data/career_profile.json \
               && python -c "import json; json.load(open('data/career_profile.json', encoding='utf-8'))"; then
              echo "career profile: restored"
            else
              echo "career profile: could not decode, packs will be skipped"; rm -f data/career_profile.json
            fi
          else
            echo "career profile: none (set OH_CAREER_PROFILE with: py sync_secrets.py)"
          fi

      - name: Run the hunt
        if: ${{ !inputs.packs_only && !inputs.pack_key && !inputs.intake_key }}
        env:
          # Phase 6: the hunt reads his ✅/⏭ taps from the bot and hands back what it learned.
          OH_WORKER_URL: ${{ secrets.OH_WORKER_URL }}
          OH_WORKER_TOKEN: ${{ secrets.OH_WORKER_TOKEN }}
        run: python main.py --now

      - name: Persist dedup + history
        if: ${{ !inputs.packs_only && !inputs.pack_key && !inputs.intake_key }}
        run: |
          git config user.name "opportunity-hunter[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # Belt and braces: the private files are gitignored, but never let one ride along.
          if git diff --staged --name-only | grep -E '(career_profile|hunt_target)'; then
            echo "::error::refusing to commit a private file"; git reset -q; exit 1
          fi
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update hunt state [skip ci]"
            git push
          fi

      # ── Phase 5A: today's best internships/jobs as ready packs on Telegram ─────────────────
      # After the state commit, so the Cloudflare bot's feed.json already knows today's items when
      # you tap ✅ Applied / ⏭ Skip on a pack. continue-on-error: the hunt and the digest have already
      # succeeded; a pack problem must never turn the daily run red.
      - name: Install the pack renderer
        continue-on-error: true
        run: |
          pip install -r requirements-resume.txt
          # Carlito is metric-compatible with Calibri, so page 1 fits the same as on the laptop.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-crosextra-carlito fonts-liberation

      - name: Send application packs
        continue-on-error: true
        timeout-minutes: 15
        env:
          OH_PACKS: "3"
          OH_WORKER_URL: ${{ secrets.OH_WORKER_URL }}       # packs re-score with what his taps taught
          OH_WORKER_TOKEN: ${{ secrets.OH_WORKER_TOKEN }}
          # Through env, never ${{ }} inside the script: an input pasted into a shell line is a
          # script-injection hole (GitHub's own hardening guide). push.py also checks the key's shape.
          PACK_KEY: ${{ inputs.pack_key }}
          INTAKE_KEY: ${{ inputs.intake_key }}
          PACKS_ONLY: ${{ inputs.packs_only }}
        run: |
          if [ -n "$INTAKE_KEY" ]; then
            python -m resume.push --intake "$INTAKE_KEY"
          elif [ -n "$PACK_KEY" ]; then
            python -m resume.push --key "$PACK_KEY"
          elif [ "$PACKS_ONLY" = "true" ]; then
            python -m resume.push --n 1 --any-day
          else
            python -m resume.push
          fi
